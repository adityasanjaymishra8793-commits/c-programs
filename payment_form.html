<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payment form</title>
    <link rel="stylesheet" href="form.css">
</head>  



<body>
  <div class="container">
       <form action="" method="get">
           <h1 class="main_heading">payment form</h1>
           <hr>
           <h2>User information</h2>
          
           <p>
            name * <input type="text" required name="name"  placeholder="enter name">
           </p>  
           <hr>
         <fieldset><legend>Gender * </legend>
         <p> 

          Male <input type="radio" name="gender" id="male" required>

          Female <input type="radio" name="gender" id="female" required>

         </p>

         </fieldset>
      
         <p>
            Address: 
            <textarea name="address" id="address" cols="100" rows="9" placeholder="enter your address"> </textarea>
         </p>

         <hr>

         <p> email * :
             <input type="email" name="email" id="email" required placeholder=" name@gmail.com">
         </p>
 
         <hr>

         <p>pincode * :
             <input type="number" 
            name="pincode" id="pincode" required placeholder=" 123456">
         </p>


         <h2>Payment Information</h2>

         <p>card type * :

         <select name="card_type" id="card_type" required>

         <option value="">--select card type--</option>

         <option class="name" value="visa">visa</option>

         <option value="rupay">rupay</option>

         <option value="american express">american express</option>

         <option value="master card">master card</option>

         </select> 
          
         <p>card number * : 
            <input type="number" name="card_number" id="card_number" placeholder="1111 2222 3333 4444" >
         </p>

         <p> expiration date * :
             <input type="date" name="exp_date" id="exp_date"  >
         </p>


         <p> cvv * :
             <input type="password" name="cvv" id="cvv" required placeholder="123">
         </p>

          <input type="submit" value="pay now">
        
     
        </form>
  </div>
</body>
</html>
